# One authoritative process. Deploys/restarts discard rooms; schedule between games.
services:
  - type: web
    name: crossfire-karts-server
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_CLIENT
        value: "false"
      - key: ROOM_CAPACITY
        value: "8"
      - key: MATCH_SECONDS
        value: "180"
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: crossfire-karts-client
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build:client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
